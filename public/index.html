<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TypeScript HTML App</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <h1>Dice Draft Challenge</h1>
      <p>Roll 6 dice, keep at least one each round, and reroll the remaining dice until all are kept.</p>
      <div id="status"></div>
      <div id="players-summary"></div>
      <div id="dice-board" class="dice-grid"></div>
      <div class="controls">
        <button id="overview-btn">Players</button>
        <button id="action-btn">Keep selected and roll remaining</button>
        <button id="reset-btn">Restart Game</button>
      </div>
      <div id="result"></div>
      <div id="score"></div>
    </div>

    <div id="player-dialog" class="dialog hidden" role="dialog" aria-modal="true" aria-labelledby="player-dialog-title">
      <div class="dialog-panel player-dialog-panel">
        <h2 id="player-dialog-title">Player Overview</h2>
        <div class="player-form">
          <input id="player-name-input" type="text" placeholder="Enter player name" />
          <button id="add-player-btn">Add player</button>
        </div>
        <ul id="player-list"></ul>
        <div class="player-dialog-actions">
          <button id="start-play-btn" disabled>Start Play</button>
          <button id="close-player-dialog">Close</button>
        </div>
      </div>
    </div>

    <div id="finish-dialog" class="dialog hidden" role="dialog" aria-modal="true" aria-labelledby="finish-title">
      <div class="dialog-panel">
        <h2 id="finish-title">Game Finished</h2>
        <p id="finish-message"></p>
        <button id="finish-close">Close</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
